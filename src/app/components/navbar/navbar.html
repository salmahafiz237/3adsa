<nav
    class="fixed top-0 left-0 right-0 z-50 bg-[#0a0a0a]/95 backdrop-blur-xl border-b border-transparent transition-all duration-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Navbar Main -->
        <div class="flex justify-between items-center h-20">

            <!-- Logo -->
            <a routerLink="home" class="flex items-center gap-3 group">
                <div
                    class="relative w-12 h-12 rounded-xl overflow-hidden group-hover:scale-105 transition-all duration-300">
                    <img src="/logo.png" alt="Photography Logo" class="w-full h-full object-cover"/>
                </div>

                <div class="flex flex-col">
                    <span
                        class="text-xl font-bold bg-linear-to-r from-white to-neutral-300 bg-clip-text text-transparent">
                        عدسة
                    </span>
                    <span class="text-xs text-orange-400/80 hidden sm:block tracking-wide">
                        عالم التصوير الفوتوغرافي
                    </span>
                </div>
            </a>

            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center">
                <div class="flex items-center bg-[#161616] rounded-full p-1.5 border border-[#262626]">
                    <a routerLink="/home" routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 text-white"
                        class="px-5 py-2.5 rounded-full text-sm font-medium transition-all duration-300 text-neutral-400 hover:text-white">
                        الرئيسية
                    </a>
                    
                    <a routerLink="/blog" routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 text-white"
                        class="px-5 py-2.5 rounded-full text-sm font-medium transition-all duration-300 text-neutral-400 hover:text-white">
                        المدونة
                    </a>
                    
                    <a routerLink="/about" routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 text-white"
                        class="px-5 py-2.5 rounded-full text-sm font-medium transition-all duration-300 text-neutral-400 hover:text-white">
                        من نحن
                    </a>
                </div>
            </div>

            <!-- Desktop Actions -->
            <div class="hidden md:flex items-center gap-3">
                <button type="button"
                    class="p-3 text-neutral-500 hover:text-orange-500 hover:bg-[#161616] rounded-xl transition-all duration-300 border border-transparent hover:border-[#262626]">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

                <a routerLink="/blog"
                    class="text-sm font-medium text-white bg-linear-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 px-9 py-4 rounded-4xl transition-all duration-300">
                    ابدأ القراءة
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button type="button" data-collapse-toggle="mobile-menu" aria-controls="mobile-menu" aria-expanded="false"
                class="md:hidden p-3 text-neutral-400 hover:text-white hover:bg-[#161616] rounded-xl transition-all duration-300 border border-transparent hover:border-[#262626]">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden overflow-hidden transition-all duration-300">
            <div class="bg-[#161616] backdrop-blur-xl rounded-2xl p-4 border border-[#262626] mb-4">
                <div class="flex flex-col space-y-1">

                    <a routerLink="/home" routerLinkActive="bg-[#3a2115] text-orange-500 border border-orange-500/30"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 text-neutral-400 hover:bg-[#1a1a1a] hover:text-white">
                        الرئيسية
                    </a>
                    
                    <a routerLink="/blog" routerLinkActive="bg-[#3a2115] text-orange-500 border border-orange-500/30"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 text-neutral-400 hover:bg-[#1a1a1a] hover:text-white">
                        المدونة
                    </a>
                    
                    <a routerLink="/about" routerLinkActive="bg-[#3a2115] text-orange-500 border border-orange-500/30"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 text-neutral-400 hover:bg-[#1a1a1a] hover:text-white">
                        من نحن
                    </a>

                    <a routerLink="/blog"
                        class="text-sm font-medium text-white text-center mt-2 bg-linear-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 px-5 py-2.5 rounded-lg transition-all duration-300">
                        ابدأ القراءة
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
